<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
     <form action="cadastro.php" method="get" autocomplete="on">
        
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmax" value="M"><label for="isxmax">MASCULINO</label>
            <input type="radio" name="sexo" id="isxmax" value="F"><label  for="isxfem">FEMININO</label>

        </fieldset>
        
        
        <fieldset>
            <legend>Esporte favoritos</legend>
             <input type="checkbox" name="esfut" id="iesfut"><label for="iesfut">Futebol</label> <br>
             <input type="checkbox" name="esbasq" id="iesbasq"><label for="iesbasq">Basquete </label><br>
             <input type="checkbox" name="esten" id="iesten"><label for="iesten">Tenis</label> <br>
             <input type="checkbox" name="esufc" id="iesufc"><label for="iesufc">UFC</label> <br>
             <input type="checkbox" name="esfutsal" id="iesfutsal"><label for="iesfutsal">Futsal</label>


        </fieldset>
        
        
        <p>
            <input type="submit" value="Enviar">    
            <input type="reset" value="Limpar"> 
        </p>

     </form>
   
</body>
</html>
