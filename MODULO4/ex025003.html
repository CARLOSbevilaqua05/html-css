<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fromulario</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cadastro.php" method="get">
       <p>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo" autocomplete="name" required> 
       </p>
      
       <p>
            <label for="imedia">Media</label>
            <input type="number" name="media" id="imedia" minlength="0" maxlength="10" placeholder="0 a 10" step="0.1" value="5" required>
       </p>
      
       <p>
            <label for="imes">Periodo letivo</label>
            <input type="month" name="mes" id="imes" value="2024-12">
       </p>

       <p>
            <label for="diaprova">Dia da prova</label>
            <input type="date" name="diaprova" id="idiaprova">
      </p>
       
       <p>
        <label for="hora">Horario da prova</label>
        <input type="time" name="hora" id="ihora">
       </p>

       <p>
            <input type="submit"value="enviar">
            <input type="reset"value="Limpar">
       </p>

    </form>
</body>
</html>
