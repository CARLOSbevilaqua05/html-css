<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="in1">Numero :1 </label>
            <input type="number" name="n1" id="in1" oninput="isoma.innerHTML=Number(in1.value) + Number(in2.value)">
        </p>

        <p>
            <label for="in1">Numero :2 </label>
            <input type="number" name="n2" id="in2" oninput="isoma.innerHTML=Number(in1.value) + Number(in2.value)">
        </p>
        
        <p>
            <label for="inumm">Número:</label>
            <input type="range" name="num" id="inum" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">5</output>
        </p>
       
        <p>
            <label for="isoma">Soma:</label>
            <output name="soma" id="isoma">0</output>
       </p>
       
        <p>
            <label for="iidade">EM QUE ANO VC NASCEU:</label>
             <input type="number" name="ano" id="iano" min="1900" max="2024" oninput="calcIdade()">
        </p>

        <p>
            <label for="iidade">Sua idade é :</label> 
            <output id="iidade">0</output>
        </p>

    
       
       
        <p>
            <input type="submit" value="ENVIAR">
            <input type="reset" value="LIMAPAR">
        </p>
    </form>
<script>
    function calcIdade(){
    let atual = new Date().getFullYear()
    iidade.innerHTML= Number(atual)- Number(iano.value)  
    }
    
</script>

</body>
</html>
