<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamneto vertical</title>
    <style>
        #container{
                background-image: url(imagens/target001.png);
                background-size: 100% 100%;
                position: relative;
                height: 97vh;
                padding: 10px;
                background-color: teal; 

        }

        #conteudo{
            position: absolute;
            height: 200px;
            width: 400px;
            background-color: yellow;
            text-align: center;
            font-family: cursive;
            color: blue;
            left: 50%;
            top: 50%;
            border-radius: 20px 20px;
            box-shadow: 10px 10px 100px 10px blue;

            transform: translate(-50%, -50%)
        }
    </style>
</head>
<body>
    <section id="container">
      <article id="conteudo">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Atque doloribus magni minima laborum et qui quibusdam consequuntur suscipit inventore dolorum soluta, ab officiis vero ex explicabo! Nemo fugiat architecto expedita.
      </article>
      
    </section>
</body>
</html>
