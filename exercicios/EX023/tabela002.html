<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas grandes</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        table{
           
            width: 500px;
            border-collapse: collapse;
        }
        td,th{
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot{
            background-color: gray;
            color: white;
        }
        td.num{
            text-align: right
        }
      
    </style>

</head>
<body>
    <h1>Uso de tabelas grandes</h1>
                        <!--
                        anatomia para tabelas grandes
                    TABLE
                        THRED 
                        TR , TD , TH
                        TBODY
                        TR,TD,TH
                        TFOOT
                        TR,TD,TH
                        -->
    <div>
        <table>
            <thead>
                <tr>
                    <th>Estado</th>
                    <th>População</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>São paulo</td>
                    <td class="num">45 919 049</td>
                </tr>
                <tr>
                  <td>Minas gerais</td>
                  <td class="num">21 168 791</td>
                </tr>
                <tr>
                    <td>Rio de janeiro</td>
                    <td class="num">17 264 943</td>
                </tr>
            </tbody>
            <tfoot>
             <tr>
                <th>Total de habitantes</th>
                <td>00000</td>
             </tr>
           </tfoot>
        </table>
    </div>
</body>
</html>
