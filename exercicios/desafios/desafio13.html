<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABELAS</title>
    <style>
     
     table{
        border-radius: 2px solid black;
        padding: 10px;
        border-collapse: collapse;
        text-align: center;
        border: 1px solid black;
        margin: 30px;
    }

    tr,td{
        border: 2px solid black;
        padding: 10px;
        border-radius: 5px;
    }
   

    </style>
</head>
<body>
    
     <table>
        <td colspan="4">A</td>
        <td rowspan="5">B</td>
        
        <tr>

            
            <td rowspan="5">C</td>
          
        </tr>
        <tr>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
            
        </tr>
        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>
       
       <td colspan="4">N</td>
        
     </table>
</body>
</html>
